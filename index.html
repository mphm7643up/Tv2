
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARVEZ AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:white;
 background:linear-gradient(135deg,#100c25,#19143b,#102c46);
 height:100dvh;
 display:flex;
 flex-direction:column;
}
header{
 height:65px;flex-shrink:0;
 display:flex;align-items:center;
 justify-content:center;
 border-bottom:1px solid #ffffff20;
 background:#ffffff08;
}
.logo{
 font-size:25px;font-weight:900;
 background:linear-gradient(90deg,#ff65cf,#a48aff,#42eaff);
 -webkit-background-clip:text;
 color:transparent;
}
#chat{
 flex:1;overflow-y:auto;
 width:100%;max-width:850px;
 margin:auto;padding:18px;
}
.msg{
 padding:13px 16px;
 margin:12px 0;
 max-width:85%;
 border-radius:17px;
 line-height:1.7;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 margin-left:auto;
 background:linear-gradient(120deg,#7c45ee,#dc4cae);
}
.ai{
 margin-right:auto;
 background:linear-gradient(120deg,#174e86,#5940a0);
}
.bottom{
 width:100%;max-width:850px;
 margin:auto;padding:12px 16px 18px;
}
.inputbox{
 display:flex;gap:9px;
 background:#ffffff13;
 border:1px solid #ffffff30;
 padding:8px;border-radius:18px;
}
input{
 flex:1;min-width:0;
 background:transparent;
 border:0;outline:0;
 color:white;padding:12px;
 font-size:16px;
}
input::placeholder{color:#bdb5d0}
button{
 border:0;border-radius:12px;
 color:white;font-size:17px;
 font-weight:bold;padding:0 19px;
 cursor:pointer;
 background:linear-gradient(120deg,#9849ff,#e34eae,#ff8c53);
}
button:disabled{opacity:.5}
.newchat{
 display:block;margin:10px auto 0;
 background:transparent;
 border:1px solid #ffffff35;
 padding:8px 15px;font-size:13px;
}
</style>
</head>
<body>

<header>
 <div class="logo">✦ PARVEZ AI</div>
</header>

<div id="chat">
 <div class="msg ai">
  আসসালামু আলাইকুম! আমি PARVEZ AI।
  আপনাকে কীভাবে সাহায্য করতে পারি?
 </div>
</div>

<div class="bottom">
 <div class="inputbox">
  <input id="message"
   placeholder="এখানে মেসেজ লিখুন..."
   onkeydown="if(event.key==='Enter')sendMessage()">
  <button id="send" onclick="sendMessage()">➤</button>
 </div>
 <button class="newchat" onclick="newChat()">＋ নতুন চ্যাট</button>
</div>

<script>

// =================================
// GEMINI API KEY
// =================================

// এখানে আপনার Gemini API Key দিন:
const API_KEY = "এখানে আপনার API KEY দিন";

// AI Model
const MODEL = "gemini-2.5-flash";

let history=[];
let busy=false;

const chat=document.getElementById("chat");
const input=document.getElementById("message");
const send=document.getElementById("send");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

function newChat(){
 history=[];
 chat.innerHTML="";
 addMessage("নতুন চ্যাট শুরু হয়েছে! কী জানতে চান?","ai");
}

async function sendMessage(){

 if(busy)return;

 if(!API_KEY || API_KEY==="এখানে আপনার API KEY দিন"){
  alert("কোডে Gemini API Key বসান।");
  return;
 }

 const text=input.value.trim();
 if(!text)return;

 addMessage(text,"user");
 input.value="";

 history.push({
  role:"user",
  parts:[{text}]
 });

 busy=true;
 send.disabled=true;

 const loading=addMessage("PARVEZ AI লিখছে...","ai");

 try{
  const response=await fetch(
   `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "x-goog-api-key":API_KEY
    },
    body:JSON.stringify({
     system_instruction:{
      parts:[{
       text:"তোমার নাম PARVEZ AI। তুমি একজন সহায়ক AI। সহজ ও সুন্দরভাবে ব্যবহারকারীর ভাষায় উত্তর দেবে।"
      }]
     },
     contents:history
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error?.message||"API Error");
  }

  const answer=data.candidates?.[0]?.content?.parts
   ?.map(p=>p.text||"").join("").trim();

  if(!answer)throw new Error("উত্তর পাওয়া যায়নি");

  history.push({
   role:"model",
   parts:[{text:answer}]
  });

  loading.textContent=answer;

 }catch(error){
  loading.textContent="দুঃখিত! "+error.message;
  history.pop();
 }finally{
  busy=false;
  send.disabled=false;
  chat.scrollTop=chat.scrollHeight;
 }
}
</script>

</body>
</html>
