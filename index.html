
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaScan - Image Metadata Extractor</title>

<script src="https://cdn.jsdelivr.net/npm/exifreader@4.23.5/dist/exif-reader.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1120;
 color:#fff;
 padding:20px;
}
.container{max-width:850px;margin:auto}
header{text-align:center;padding:25px 0}
h1{color:#38bdf8;font-size:34px}
header p{color:#94a3b8}
.upload{
 border:2px dashed #38bdf8;
 border-radius:15px;
 padding:45px 15px;
 text-align:center;
 background:#111c30;
 cursor:pointer;
}
.upload:hover{background:#172943}
button{
 background:#0284c7;color:white;
 border:0;padding:12px 20px;
 border-radius:8px;cursor:pointer;
 margin:8px 3px;
}
button:hover{background:#0369a1}
input{display:none}
#preview{
 max-width:100%;max-height:300px;
 margin:20px auto;display:none;
 border-radius:12px;
}
#results{margin-top:25px}
.card{
 background:#172337;
 padding:18px;
 margin:12px 0;
 border-radius:12px;
 overflow-wrap:anywhere;
}
.card h3{color:#38bdf8;margin-top:0}
.item{
 display:flex;justify-content:space-between;
 gap:15px;padding:10px 0;
 border-bottom:1px solid #334155;
}
.item span:first-child{color:#94a3b8}
.item span:last-child{text-align:right}
a{color:#38bdf8}
.status{color:#fbbf24}
footer{text-align:center;color:#64748b;margin:35px 0}
</style>
</head>

<body>
<div class="container">

<header>
<h1>MetaScan</h1>
<p>Image Metadata & GPS Analyzer</p>
</header>

<div class="upload" id="drop">
<h2>📸 Upload Your Image</h2>
<p>ছবি এখানে আপলোড করুন অথবা ক্লিক করুন</p>
<button type="button" onclick="document.getElementById('file').click()">
Choose Image
</button>
<input type="file" id="file" accept="image/*">
</div>

<img id="preview" alt="Uploaded image preview">

<div id="results"></div>

<footer>
MetaScan © 2026 | Privacy First
</footer>

</div>

<script>
const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const preview = document.getElementById("preview");
const results = document.getElementById("results");

fileInput.addEventListener("change", e => {
 if(e.target.files[0]) analyze(e.target.files[0]);
});

drop.addEventListener("dragover", e => {
 e.preventDefault();
 drop.style.background = "#1e3a5f";
});

drop.addEventListener("dragleave", () => {
 drop.style.background = "#111c30";
});

drop.addEventListener("drop", e => {
 e.preventDefault();
 drop.style.background = "#111c30";
 const file = e.dataTransfer.files[0];
 if(file) analyze(file);
});

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function row(name,value){
 return `<div class="item">
 <span>${escapeHTML(name)}</span>
 <span>${escapeHTML(value)}</span>
 </div>`;
}

async function analyze(file){
 results.innerHTML = "";
 if(!file.type.startsWith("image/")){
  results.innerHTML = '<p class="status">সঠিক Image ফাইল নির্বাচন করুন।</p>';
  return;
 }

 if(file.size > 25*1024*1024){
  results.innerHTML = '<p class="status">ফাইল ২৫ MB-এর চেয়ে ছোট হতে হবে।</p>';
  return;
 }

 preview.src = URL.createObjectURL(file);
 preview.style.display = "block";
 results.innerHTML = '<p class="status">Metadata বিশ্লেষণ হচ্ছে...</p>';

 const basic = {
  "File Name":file.name,
  "File Type":file.type || "Unknown",
  "File Size":(file.size/1024).toFixed(2)+" KB",
  "Last Modified":new Date(file.lastModified).toLocaleString()
 };

 let tags = {};
 let error = "";

 try{
  tags = await ExifReader.load(file,{expanded:true});
 }catch(e){
  error = "এই ছবিতে EXIF তথ্য পড়া যায়নি।";
 }

 let output = `<div class="card"><h3>📁 File Information</h3>`;
 for(const [k,v] of Object.entries(basic)){
  output += row(k,v);
 }
 output += `</div>`;

 let gpsLink = "";
 let gpsFound = false;
 let lat = null, lon = null;

 const gps = tags.gps || {};
 if(gps.Latitude && gps.Longitude){
  lat = Number(gps.Latitude.description ?? gps.Latitude.value);
  lon = Number(gps.Longitude.description ?? gps.Longitude.value);
  if(Number.isFinite(lat) && Number.isFinite(lon)){
   gpsFound = true;
   gpsLink = `https://www.google.com/maps?q=${lat},${lon}`;
  }
 }

 if(gpsFound){
  output += `<div class="card"><h3>📍 GPS Location</h3>`;
  output += row("Latitude",lat);
  output += row("Longitude",lon);
  output += `<p><a href="${gpsLink}" target="_blank" rel="noopener">Open coordinates in Google Maps</a></p></div>`;
 }else{
  output += `<div class="card"><h3>📍 GPS Location</h3>
  <p class="status">GPS Location Not Available</p>
  <p>ছবিতে GPS তথ্য পাওয়া যায়নি।</p></div>`;
 }

 const groups = ["exif","file","iptc","xmp","thumbnail","interoperability"];
 for(const group of groups){
  const data = tags[group];
  if(!data || typeof data !== "object") continue;

  output += `<div class="card"><h3>📷 ${escapeHTML(group.toUpperCase())} Metadata</h3>`;

  for(const [key,value] of Object.entries(data)){
   let display = value?.description ?? value?.value ?? value;
   if(Array.isArray(display)) display = display.join(", ");
   if(typeof display === "object"){
    display = JSON.stringify(display);
   }
   if(display !== undefined && display !== null){
    output += row(key,display);
   }
  }
  output += `</div>`;
 }

 if(error){
  output += `<div class="card">${escapeHTML(error)}</div>`;
 }

 results.innerHTML = output;

 window.metadataReport = {
  file:basic,
  metadata:tags,
  gps:gpsFound ? {latitude:lat,longitude:lon} : null
 };

 results.insertAdjacentHTML("beforeend",`
 <div class="card">
 <h3>⬇️ Export Report</h3>
 <button onclick="downloadReport()">Download JSON</button>
 </div>`);
}

function downloadReport(){
 const data = JSON.stringify(window.metadataReport,null,2);
 const blob = new Blob([data],{type:"application/json"});
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");
 a.href = url;
 a.download = "metascan-report.json";
 a.click();
 URL.revokeObjectURL(url);
}
</script>
</body>
</html>
