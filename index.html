
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARVEZ AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0d0b18;
 color:white;
}
header{
 padding:18px;
 background:#171329;
 border-bottom:1px solid #30264c;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{
 font-size:23px;
 font-weight:bold;
 color:#a78bfa;
}
.status{font-size:12px;color:#a78bfa}
.container{
 max-width:850px;
 margin:auto;
 padding:18px;
}
.settings{
 background:#19152b;
 padding:15px;
 border-radius:14px;
 margin-bottom:15px;
}
input,button{
 border:0;
 outline:0;
 border-radius:9px;
 padding:13px;
}
#apiKey{
 width:100%;
 background:#29233e;
 color:white;
 margin:10px 0;
}
button{
 cursor:pointer;
 background:linear-gradient(120deg,#7654f5,#bd55d9);
 color:white;
 font-weight:bold;
}
.chat{
 height:55vh;
 min-height:300px;
 overflow-y:auto;
 padding:12px;
 background:#151222;
 border-radius:14px;
}
.msg{
 padding:13px;
 margin:12px 0;
 border-radius:12px;
 max-width:90%;
 line-height:1.6;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 background:#6547c9;
 margin-left:auto;
}
.ai{
 background:#29243b;
 margin-right:auto;
}
.input-area{
 display:flex;
 gap:8px;
 margin-top:14px;
}
#message{
 flex:1;
 min-width:0;
 background:#29233e;
 color:white;
}
.actions{
 display:flex;
 justify-content:space-between;
 margin-top:12px;
}
.small{
 font-size:12px;
 color:#aaa;
 margin-top:12px;
}
button:disabled{opacity:.5}
</style>
</head>

<body>

<header>
 <div class="logo">✦ PARVEZ AI</div>
 <div class="status">● AI ONLINE</div>
</header>

<div class="container">

 <div class="settings">
  <b>⚙ API Settings</b>
  <input
   type="password"
   id="apiKey"
   placeholder="এখানে আপনার Gemini API Key দিন"
   autocomplete="off"
  >
  <button onclick="clearKey()">API Key মুছুন</button>
  <div class="small">
   API Key শুধু এই ব্রাউজার সেশনে ব্যবহার হবে।
   পেজ রিফ্রেশ করলে আবার দিতে হবে।
  </div>
 </div>

 <div class="chat" id="chat">
  <div class="msg ai">
   আসসালামু আলাইকুম! আমি PARVEZ AI।

   আমাকে যেকোনো প্রশ্ন করতে পারো।
  </div>
 </div>

 <div class="input-area">
  <input
   id="message"
   placeholder="এখানে আপনার প্রশ্ন লিখুন..."
   onkeydown="if(event.key==='Enter') sendMessage()"
  >
  <button id="sendBtn" onclick="sendMessage()">Send ➤</button>
 </div>

 <div class="actions">
  <button onclick="newChat()">＋ নতুন চ্যাট</button>
  <button onclick="clearChat()">চ্যাট মুছুন</button>
 </div>

 <div class="small">
  PARVEZ AI © 2026 | Powered by Gemini AI
 </div>

</div>

<script>

// ==================================
// API SETTINGS
// ==================================

// Gemini API Key এখানে কোডে লিখতে হবে না।
// ওয়েবসাইটের API Key ঘরে দিতে হবে।

const MODEL = "gemini-2.5-flash";

let history = [];
let busy = false;

const chat = document.getElementById("chat");
const message = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, type){
 const div = document.createElement("div");
 div.className = "msg " + type;
 div.textContent = text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
 return div;
}

function clearKey(){
 document.getElementById("apiKey").value="";
}

function newChat(){
 history=[];
 chat.innerHTML="";
 addMessage("নতুন চ্যাট শুরু হয়েছে! কী জানতে চাও?","ai");
}

function clearChat(){
 if(!confirm("সব চ্যাট মুছে ফেলবেন?")) return;
 newChat();
}

async function sendMessage(){

 if(busy) return;

 const apiKey =
 document.getElementById("apiKey").value.trim();

 const text = message.value.trim();

 if(!apiKey){
  alert("প্রথমে Gemini API Key দিন।");
  return;
 }

 if(!text) return;

 addMessage(text,"user");
 message.value="";

 history.push({
  role:"user",
  parts:[{text:text}]
 });

 busy=true;
 sendBtn.disabled=true;
 sendBtn.textContent="অপেক্ষা করুন...";

 const loading=addMessage("PARVEZ AI উত্তর তৈরি করছে...","ai");

 try{

  const response=await fetch(
   `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "x-goog-api-key":apiKey
    },
    body:JSON.stringify({
     system_instruction:{
      parts:[{
       text:"তোমার নাম PARVEZ AI। তুমি একজন সহায়ক AI সহকারী। ব্যবহারকারীর ভাষা অনুযায়ী সহজ, সুন্দর ও নির্ভুল উত্তর দাও।"
      }]
     },
     contents:history
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(
    data.error?.message || "API সংযোগে সমস্যা হয়েছে"
   );
  }

  const answer=
   data.candidates?.[0]?.content?.parts
    ?.map(p=>p.text || "")
    .join("")
    .trim();

  if(!answer){
   throw new Error("AI কোনো উত্তর দেয়নি।");
  }

  history.push({
   role:"model",
   parts:[{text:answer}]
  });

  loading.textContent=answer;

 }catch(error){

  loading.textContent="সমস্যা: "+error.message;

  history.pop();

 }finally{

  busy=false;
  sendBtn.disabled=false;
  sendBtn.textContent="Send ➤";
  chat.scrollTop=chat.scrollHeight;

 }
}

</script>

</body>
</html>
