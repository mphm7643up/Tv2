
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImageSearch AI</title>
<style>
body{
  background:#080d19;color:white;
  font-family:Arial;text-align:center;
  padding:30px 15px;
}
h1{color:#55a0ff}
.box{
  max-width:500px;margin:40px auto;
  padding:35px 15px;background:#152238;
  border:2px dashed #55a0ff;border-radius:18px;
}
button{
  background:#2879ed;color:white;
  border:0;padding:13px 20px;
  border-radius:9px;margin:10px;
  cursor:pointer;
}
img{max-width:100%;max-height:300px;
  margin:20px auto;border-radius:12px}
a{color:#75b5ff;display:block;margin:20px}
</style>
</head>
<body>

<h1>✦ ImageSearch AI</h1>
<p>Upload an image to find public image sources</p>

<div class="box">
<input type="file" id="file" accept="image/*">
<br>
<img id="preview" hidden>
<br>
<button onclick="search()">Search Image</button>
<div id="links"></div>
</div>

<script>
const file=document.getElementById('file');
const preview=document.getElementById('preview');

file.onchange=()=>{
 const f=file.files[0];
 if(!f)return;
 if(!f.type.startsWith('image/') || f.size>10*1024*1024){
  alert('Select a valid image under 10 MB');
  file.value='';
  return;
 }
 preview.src=URL.createObjectURL(f);
 preview.hidden=false;
 document.getElementById('links').innerHTML='';
};

function search(){
 if(!file.files[0]){
  alert('Upload an image first');
  return;
 }
 document.getElementById('links').innerHTML=`
 <p>Choose a search service:</p>
 <a href="https://lens.google.com/" target="_blank">Google Lens ↗</a>
 <a href="https://www.bing.com/visualsearch" target="_blank">Bing Visual Search ↗</a>
 <p>Upload your image on the selected service.</p>`;
}
</script>

</body>
</html>
