<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Playlist Editor</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1020;
 color:#fff;
}
header{
 padding:18px;
 background:#121a2d;
 border-bottom:1px solid #26334d;
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:12px;
}
.logo{font-size:21px;font-weight:bold;color:#35d6b0}
.container{max-width:1250px;margin:auto;padding:18px}
.panel{
 background:#141e32;
 border:1px solid #293750;
 border-radius:13px;
 padding:16px;
 margin-bottom:16px;
}
h2{font-size:18px;margin:0 0 14px}
input,button,select{
 padding:12px;
 border-radius:8px;
 border:1px solid #34435e;
 background:#0d1628;
 color:white;
 font-size:14px;
}
input{min-width:0}
button{cursor:pointer;background:#167c70;border:none}
button:hover{filter:brightness(1.15)}
.btn-secondary{background:#33435f}
.btn-danger{background:#c13e4d}
.btn-blue{background:#2466bb}
.controls{display:flex;gap:9px;flex-wrap:wrap}
.controls input{flex:1}
.player{
 background:#05080e;
 border-radius:12px;
 overflow:hidden;
}
video{
 width:100%;
 max-height:430px;
 display:block;
 background:#000;
}
.player-info{padding:12px}
.layout{
 display:grid;
 grid-template-columns:260px 1fr;
 gap:16px;
}
.category-list{
 display:flex;
 flex-direction:column;
 gap:8px;
}
.category{
 padding:13px;
 border:1px solid #30405a;
 background:#101a2d;
 border-radius:9px;
 cursor:pointer;
 display:flex;
 justify-content:space-between;
 gap:8px;
}
.category.active{
 background:#12685e;
 border-color:#29d4b1;
}
.category small{color:#c4d0df}
.channel-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
 gap:11px;
}
.channel{
 background:#101a2c;
 border:1px solid #2c3b55;
 border-radius:11px;
 padding:12px;
 cursor:pointer;
 min-width:0;
}
.channel.active{border:2px solid #2bd5b0}
.channel img{
 width:55px;
 height:55px;
 object-fit:contain;
 background:#fff;
 border-radius:9px;
 padding:3px;
}
.channel-name{
 font-weight:bold;
 margin-top:9px;
 overflow-wrap:anywhere;
}
.channel-actions{
 display:flex;
 gap:6px;
 margin-top:10px;
}
.channel-actions button{flex:1;padding:8px;font-size:12px}
.empty{
 text-align:center;
 color:#9aaac0;
 padding:30px 10px;
}
.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:13px;
}
.section-head h2{margin:0}
.status{font-size:12px;color:#a8b8cc;margin-top:8px}
.footer{text-align:center;color:#77869b;padding:20px;font-size:12px}
@media(max-width:700px){
 .layout{grid-template-columns:1fr}
 .category-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
 }
 .container{padding:10px}
 header{padding:14px}
 .channel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
 <div class="logo">📺 IPTV PLAYLIST EDITOR</div>
 <div class="controls">
  <button onclick="document.getElementById('fileInput').click()">📂 Import M3U</button>
  <button class="btn-blue" onclick="exportM3U()">⬇ Export M3U</button>
 </div>
</header>

<div class="container">

<div class="panel">
 <h2>📥 Playlist Import</h2>
 <div class="controls">
  <input id="playlistURL" placeholder="M3U Playlist URL দিন">
  <button onclick="importURL()">Import URL</button>
 </div>
 <div class="controls" style="margin-top:10px">
  <button class="btn-secondary" onclick="addChannel()">＋ Add Channel</button>
  <button class="btn-secondary" onclick="addCategory()">＋ New Category</button>
  <button class="btn-danger" onclick="clearPlaylist()">Clear Playlist</button>
 </div>
 <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" hidden>
 <div class="status" id="status">আপনার M3U Playlist Import করুন।</div>
</div>

<div class="panel">
 <h2>▶ Video Player</h2>
 <div class="player">
  <video id="video" controls playsinline></video>
  <div class="player-info">
   <strong id="playingName">কোনো চ্যানেল নির্বাচন করা হয়নি</strong>
   <div class="status" id="playerStatus">চ্যানেল নির্বাচন করুন</div>
  </div>
 </div>
</div>

<div class="layout">

 <div class="panel">
  <div class="section-head">
   <h2>📁 Categories</h2>
  </div>
  <div id="categoryList" class="category-list"></div>
 </div>

 <div class="panel">
  <div class="section-head">
   <h2 id="categoryTitle">চ্যানেল তালিকা</h2>
   <span id="channelCount" class="status"></span>
  </div>

  <input id="search" placeholder="🔎 এই ক্যাটাগরির চ্যানেল খুঁজুন..."
   style="width:100%;margin-bottom:13px"
   oninput="renderChannels()">

  <div id="channelList" class="channel-grid"></div>
 </div>

</div>

<div class="footer">
 IPTV Playlist Editor • Personal Playlist Management
</div>
</div>

<script>
let channels = [];
let categories = [];
let selectedCategory = null;
let selectedChannel = null;
let hls = null;

const video = document.getElementById("video");

const defaultCategories = [
 "বাংলা চ্যানেল",
 "হিন্দি চ্যানেল",
 "ইংরেজি চ্যানেল",
 "স্পোর্টস",
 "মুভি",
 "নিউজ",
 "কার্টুন",
 "মিউজিক",
 "অন্যান্য",
 "Uncategorized"
];

function saveData(){
 try{
  localStorage.setItem("iptv_channels",JSON.stringify(channels));
  localStorage.setItem("iptv_categories",JSON.stringify(categories));
 }catch(e){
  setStatus("স্টোরেজ পূর্ণ হতে পারে। Playlist Export করে রাখুন।");
 }
}

function setStatus(message){
 document.getElementById("status").textContent=message;
}

function cleanCategory(value){
 return (value || "").trim() || "Uncategorized";
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function init(){
 try{
  channels=JSON.parse(localStorage.getItem("iptv_channels")||"[]");
  categories=JSON.parse(localStorage.getItem("iptv_categories")||"[]");
 }catch(e){
  channels=[];
  categories=[];
 }

 defaultCategories.forEach(c=>{
  if(!categories.includes(c)) categories.push(c);
 });

 channels.forEach(c=>{
  c.group=cleanCategory(c.group);
  if(!categories.includes(c.group)) categories.push(c.group);
 });

 selectedCategory=categories[0] || "বাংলা চ্যানেল";

 saveData();
 renderAll();
}

function renderAll(){
 renderCategories();
 renderChannels();
}

function renderCategories(){
 const box=document.getElementById("categoryList");
 box.innerHTML="";

 categories.forEach(cat=>{
  const count=channels.filter(c=>c.group===cat).length;

  const item=document.createElement("div");
  item.className="category"+(selectedCategory===cat?" active":"");

  item.innerHTML=`
   <span>${escapeHTML(cat)}</span>
   <small>${count}</small>
  `;

  item.onclick=()=>{
   selectedCategory=cat;
   renderAll();
  };

  box.appendChild(item);
 });
}

function renderChannels(){
 const box=document.getElementById("channelList");
 const search=document.getElementById("search").value.toLowerCase();

 const list=channels.filter(c=>
  c.group===selectedCategory &&
  c.name.toLowerCase().includes(search)
 );

 document.getElementById("categoryTitle").textContent=
  "📺 "+selectedCategory;

 document.getElementById("channelCount").textContent=
  list.length+" টি চ্যানেল";

 box.innerHTML="";

 if(list.length===0){
  box.innerHTML='<div class="empty">এই ক্যাটাগরিতে কোনো চ্যানেল নেই।<br>নতুন চ্যানেল যোগ করুন অথবা M3U Import করুন।</div>';
  return;
 }

 list.forEach(channel=>{
  const index=channels.indexOf(channel);
  const card=document.createElement("div");

  card.className="channel"+
   (selectedChannel===index?" active":"");

  const logo=channel.logo?
   `<img src="${escapeHTML(channel.logo)}" onerror="this.style.display='none'" alt="">`:
   `<div style="font-size:38px">📺</div>`;

  card.innerHTML=`
   ${logo}
   <div class="channel-name">${escapeHTML(channel.name)}</div>
   <div class="status">${escapeHTML(channel.group)}</div>
   <div class="channel-actions">
    <button class="btn-blue play-btn">Play</button>
    <button class="btn-secondary edit-btn">Edit</button>
    <button class="btn-danger delete-btn">Delete</button>
   </div>
  `;

  card.addEventListener("click",()=>playChannel(index));
  card.querySelector(".play-btn").addEventListener("click",e=>{
   e.stopPropagation();
   playChannel(index);
  });
  card.querySelector(".edit-btn").addEventListener("click",e=>{
   e.stopPropagation();
   editChannel(index);
  });
  card.querySelector(".delete-btn").addEventListener("click",e=>{
   e.stopPropagation();
   deleteChannel(index);
  });

  box.appendChild(card);
 });
}

function addCategory(){
 const name=prompt("নতুন ক্যাটাগরির নাম লিখুন:");
 if(!name || !name.trim()) return;

 const cat=name.trim();

 if(categories.includes(cat)){
  alert("এই ক্যাটাগরি আগে থেকেই আছে।");
  return;
 }

 categories.push(cat);
 selectedCategory=cat;
 saveData();
 renderAll();
}

function addChannel(){
 const name=prompt("চ্যানেলের নাম লিখুন:");
 if(!name || !name.trim()) return;

 const url=prompt("চ্যানেলের Stream URL দিন:");
 if(!url || !url.trim()) return;

 const logo=prompt("চ্যানেলের Logo URL (ঐচ্ছিক):")||"";

 channels.push({
  name:name.trim(),
  url:url.trim(),
  logo:logo.trim(),
  group:selectedCategory || "Uncategorized",
  tvgId:"",
  tvgName:""
 });

 saveData();
 renderAll();
 setStatus("নতুন চ্যানেল যোগ হয়েছে।");
}

function editChannel(index){
 const c=channels[index];
 if(!c)return;

 const name=prompt("চ্যানেলের নাম:",c.name);
 if(name===null)return;

 const url=prompt("Stream URL:",c.url);
 if(url===null)return;

 const group=prompt("ক্যাটাগরির নাম:",c.group);
 if(group===null)return;

 const logo=prompt("Logo URL:",c.logo||"");
 if(logo===null)return;

 c.name=name.trim()||c.name;
 c.url=url.trim()||c.url;
 c.group=cleanCategory(group);

 c.logo=logo.trim();

 if(!categories.includes(c.group))categories.push(c.group);

 saveData();
 renderAll();
}

function deleteChannel(index){
 if(!confirm("এই চ্যানেলটি মুছে ফেলতে চান?"))return;

 channels.splice(index,1);

 if(selectedChannel===index) selectedChannel=null;

 saveData();
 renderAll();
}

function parseM3U(text){
 const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/);
 const imported=[];
 let current=null;

 for(let line of lines){
  line=line.trim();
  if(!line)continue;

  if(line.startsWith("#EXTINF")){
   const attrs={};
   const regex=/([\w-]+)="([^"]*)"/g;
   let match;

   while((match=regex.exec(line))!==null){
    attrs[match[1]]=match[2];
   }

   const comma=line.lastIndexOf(",");
   const name=comma>=0?line.slice(comma+1).trim():
    (attrs["tvg-name"]||"Unknown Channel");

   current={
    name:name || attrs["tvg-name"] || "Unknown Channel",
    url:"",
    logo:attrs["tvg-logo"]||"",
    group:cleanCategory(attrs["group-title"]),
    tvgId:attrs["tvg-id"]||"",
    tvgName:attrs["tvg-name"]||""
   };

  }else if(!line.startsWith("#") && current){
   current.url=line;
   imported.push(current);
   current=null;
  }
 }

 return imported;
}

function importText(text){
 const imported=parseM3U(text);

 if(!imported.length){
  alert("কোনো চ্যানেল পাওয়া যায়নি। M3U ফাইল পরীক্ষা করুন।");
  return;
 }

 imported.forEach(c=>{
  if(!categories.includes(c.group))categories.push(c.group);
 });

 channels=imported;
 selectedCategory=channels[0].group;

 saveData();
 renderAll();

 setStatus(imported.length+" টি চ্যানেল Import হয়েছে।");
}

document.getElementById("fileInput").addEventListener("change",async function(e){
 const file=e.target.files[0];
 if(!file)return;

 try{
  const text=await file.text();
  importText(text);
 }catch(err){
  alert("ফাইল পড়া যায়নি।");
 }

 e.target.value="";
});

async function importURL(){
 const url=document.getElementById("playlistURL").value.trim();
 if(!url){
  alert("M3U URL দিন।");
  return;
 }

 setStatus("Playlist ডাউনলোড হচ্ছে...");

 try{
  const response=await fetch(url);

  if(!response.ok)throw new Error("HTTP "+response.status);

  const text=await response.text();
  importText(text);
 }catch(e){
  setStatus("Import ব্যর্থ হয়েছে। URL অথবা CORS সমস্যা হতে পারে।");
  alert("URL থেকে Playlist আনা যায়নি। সার্ভার CORS অনুমতি না দিলে সরাসরি Import সম্ভব নয়। ফাইল Upload করে চেষ্টা করুন।");
 }
}

function exportM3U(){
 if(!channels.length){
  alert("Export করার মতো কোনো চ্যানেল নেই।");
  return;
 }

 let output="#EXTM3U\n";

 channels.forEach(c=>{
  output+=`#EXTINF:-1 tvg-id="${c.tvgId||""}" tvg-name="${c.tvgName||c.name}" tvg-logo="${c.logo||""}" group-title="${c.group}",${c.name}\n`;
  output+=c.url+"\n";
 });

 const blob=new Blob([output],{type:"audio/x-mpegurl;charset=utf-8"});
 const link=document.createElement("a");
 link.href=URL.createObjectURL(blob);
 link.download="my-playlist.m3u";
 link.click();
 URL.revokeObjectURL(link.href);

 setStatus("M3U Playlist Export হয়েছে।");
}

function clearPlaylist(){
 if(!confirm("সব চ্যানেল মুছে ফেলতে চান?"))return;

 channels=[];
 selectedChannel=null;
 stopPlayer();

 saveData();
 renderAll();
 setStatus("Playlist পরিষ্কার করা হয়েছে।");
}

function stopPlayer(){
 if(hls){
  hls.destroy();
  hls=null;
 }

 video.pause();
 video.removeAttribute("src");
 video.load();
}

function playChannel(index){
 const c=channels[index];
 if(!c)return;

 selectedChannel=index;
 document.getElementById("playingName").textContent=c.name;
 document.getElementById("playerStatus").textContent="Stream লোড হচ্ছে...";

 renderChannels();
 stopPlayer();

 const url=c.url.trim();

 try{
  if(url.includes(".m3u8") && Hls.isSupported()){
   hls=new Hls();
   hls.loadSource(url);
   hls.attachMedia(video);

   hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    video.play().catch(()=>{});
    document.getElementById("playerStatus").textContent="Stream প্রস্তুত";
   });

   hls.on(Hls.Events.ERROR,(event,data)=>{
    if(data.fatal){
     document.getElementById("playerStatus").textContent=
      "Stream চালানো যায়নি। URL বা সার্ভার পরীক্ষা করুন।";
    }
   });

  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
   video.src=url;
   video.play().catch(()=>{});
   document.getElementById("playerStatus").textContent="Stream লোড হচ্ছে";

  }else{
   video.src=url;
   video.play().catch(()=>{
    document.getElementById("playerStatus").textContent=
     "ভিডিও চালু করতে Play চাপুন অথবা Stream URL পরীক্ষা করুন।";
   });
  }
 }catch(e){
  document.getElementById("playerStatus").textContent="Player Error";
 }
}

init();
</script>

</body>
</html>
