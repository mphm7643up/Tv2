
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARVEZ AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1ff;font-family:Arial,sans-serif;color:#211b38}
header{background:linear-gradient(120deg,#6925ed,#3100a8);color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0}
nav{display:flex;background:white;padding:10px;gap:10px}
nav button{flex:1;padding:13px;border:0;border-radius:12px;font-size:16px;background:#eee8ff;color:#4420a0}
nav button.active{background:#6528ed;color:white}
main{max-width:750px;margin:18px auto;padding:12px}
.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 25px #d8c9ff}
#chat{height:55vh;min-height:300px;overflow:auto;margin-bottom:12px}
.msg{padding:12px 15px;border-radius:14px;margin:10px 0;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.bot{background:#eee8ff}
.user{background:#6225e8;color:white;margin-left:auto}
input,textarea{width:100%;padding:14px;border:1px solid #c8b4ff;border-radius:12px;font-size:16px;outline:none}
#question{resize:none}
.sendrow{display:flex;gap:8px}
button{cursor:pointer}
.sendrow button,.save{border:0;border-radius:12px;background:#6425e9;color:white;padding:12px 20px;font-size:16px}
.save{width:100%;margin-top:12px}
#settings{display:none}
.status{font-size:14px;color:#16833b;margin-top:12px}
small{color:#777}
</style>
</head>
<body>

<header>
<h1>🤖 PARVEZ AI</h1>
<p>Powered by Google Gemini</p>
</header>

<nav>
<button id="chatTab" class="active" onclick="showPage('chatPage',this)">💬 AI Chat</button>
<button id="settingTab" onclick="showPage('settings',this)">⚙️ Settings</button>
</nav>

<main>
<section id="chatPage" class="panel">
<div id="chat">
<div class="msg bot">👋 আসসালামু আলাইকুম! আমি PARVEZ AI। আমাকে যেকোনো প্রশ্ন করতে পারেন।</div>
</div>

<div class="sendrow">
<input id="question" placeholder="এখানে আপনার প্রশ্ন লিখুন..."
onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">➤</button>
</div>
</section>

<section id="settings" class="panel">
<h2>⚙️ Gemini API Settings</h2>
<p>আপনার Gemini API Key দিন</p>
<input id="apiKey" type="password" placeholder="এখানে API Key পেস্ট করুন">
<button class="save" onclick="saveKey()">💾 Save API Key</button>
<p id="status" class="status"></p>
<small>আপনার ব্রাউজারেই Key সংরক্ষিত থাকবে।</small>
</section>
</main>

<script>
const MODEL = "gemini-3.8-flash";
let history = [];

function showPage(id,btn){
 document.getElementById('chatPage').style.display =
 id==='chatPage'?'block':'none';
 document.getElementById('settings').style.display =
 id==='settings'?'block':'none';
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
}

function saveKey(){
 const key=document.getElementById('apiKey').value.trim();
 if(!key){
  status.textContent='API Key দিন';
  return;
 }
 localStorage.setItem('gemini_api',key);
 document.getElementById('apiKey').value='';
 status.textContent='✅ API Key সফলভাবে সেভ হয়েছে!';
}

async function sendMessage(){
 const box=document.getElementById('question');
 const question=box.value.trim();
 const key=localStorage.getItem('gemini_api');
 const chat=document.getElementById('chat');

 if(!question)return;
 if(!key){
  alert('আগে Settings থেকে API Key সেভ করুন');
  showPage('settings',document.getElementById('settingTab'));
  return;
 }

 box.value='';
 addMessage(question,'user');

 const loading=addMessage('উত্তর তৈরি হচ্ছে...','bot');

 try{
  const contents=[...history,{
   role:'user',
   parts:[{text:question}]
  }];

  const response=await fetch(
   `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
   {
    method:'POST',
    headers:{
     'Content-Type':'application/json',
     'x-goog-api-key':key
    },
    body:JSON.stringify({contents})
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error?.message||'API সংযোগে সমস্যা হয়েছে');
  }

  const answer=data.candidates?.[0]?.content?.parts
   ?.map(p=>p.text||'').join('')||'উত্তর পাওয়া যায়নি';

  loading.textContent=answer;

  history.push(
   {role:'user',parts:[{text:question}]},
   {role:'model',parts:[{text:answer}]}
  );

 }catch(error){
  loading.textContent='সমস্যা: '+error.message;
 }
}

function addMessage(text,type){
 const chat=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='msg '+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}
</script>
</body>
</html>
