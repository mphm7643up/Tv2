
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARVES TV - Live TV Streaming</title>
<meta name="description" content="Watch live TV, sports, Bangla, Hindi and entertainment channels on PARVES TV.">
<meta name="theme-color" content="#101426">
<link rel="icon" href="https://i.ibb.co.com/PvnVqbdS/cpt-1469868507562.jpg">

<link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.2/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

<style>
:root {
 --bg:#0b1020;
 --panel:#151d35;
 --panel2:#1c2745;
 --accent:#668cff;
 --accent2:#a477ff;
 --text:#f2f5ff;
 --muted:#a6b1cc;
 --border:#2c395d;
}

* {box-sizing:border-box}

body {
 margin:0;
 padding:18px;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,'Segoe UI',sans-serif;
}

.main-container {
 display:flex;
 gap:18px;
 max-width:1800px;
 margin:auto;
 flex-wrap:wrap;
 justify-content:center;
}

.player-section {
 flex:3.7;
 min-width:320px;
 padding:18px;
 border-radius:14px;
 background:var(--panel);
 border:1px solid var(--border);
}

.header-wrapper {
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:14px;
 margin-bottom:15px;
 flex-wrap:wrap;
}

.logo-header {
 font-size:27px;
 font-weight:900;
 letter-spacing:2px;
 color:var(--accent);
 white-space:nowrap;
}

.header-server-switcher {
 flex:1;
 min-width:230px;
 background:var(--bg);
 border:1px solid var(--border);
 padding:10px;
 border-radius:10px;
 display:flex;
 flex-direction:column;
 gap:8px;
}

.server-title {
 color:#a98aff;
 font-size:14px;
 font-weight:bold;
 text-align:center;
}

.server-stacked-notices {
 display:flex;
 flex-direction:column;
 gap:5px;
}

.server-inline-notice {
 overflow:hidden;
 white-space:nowrap;
 background:#1c2948;
 border:1px solid var(--border);
 border-radius:5px;
 padding:4px;
}

.server-inline-notice marquee {
 color:#a9c0ff;
 font-size:11px;
 font-weight:bold;
}

.server-buttons-wrap {
 display:flex;
 gap:7px;
 justify-content:center;
 flex-wrap:wrap;
}

.server-btn,.cat-btn,.q-btn,.btn {
 cursor:pointer;
 border:1px solid var(--border);
 border-radius:7px;
 background:var(--panel2);
 color:white;
 font-weight:bold;
 transition:.2s;
}

.server-btn {
 padding:6px 13px;
 font-size:12px;
}

.server-btn:hover,.cat-btn:hover,.q-btn:hover,.btn:hover {
 border-color:var(--accent);
 color:#fff;
 background:#354b80;
}

.server-btn.active,.cat-btn.active,.q-btn.active {
 background:linear-gradient(120deg,var(--accent),var(--accent2));
 border-color:transparent;
 color:white;
}

.channel-list-container {
 flex:2.1;
 display:flex;
 flex-direction:column;
 min-width:300px;
}

.category-bar {
 display:flex;
 gap:7px;
 width:100%;
 margin-bottom:12px;
 overflow-x:auto;
 padding-bottom:6px;
}

.cat-btn {
 padding:9px 14px;
 border-radius:20px;
 font-size:12px;
 white-space:nowrap;
 flex-shrink:0;
}

.channel-list {
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px;
 height:72vh;
 overflow-y:auto;
 background:var(--panel);
 padding:13px;
 border:1px solid var(--border);
 border-radius:12px 12px 0 0;
 align-content:start;
}

.ch-btn {
 background:var(--panel2);
 padding:9px;
 border-radius:9px;
 cursor:pointer;
 text-align:center;
 border:1px solid var(--border);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:7px;
 width:100%;
 height:98px;
 transition:.2s;
}

.ch-btn:hover {
 background:#29395f;
 border-color:var(--accent);
 transform:translateY(-2px);
}

.ch-btn img {
 width:49px;
 height:49px;
 object-fit:contain;
}

.ch-btn strong {
 font-size:12px;
 color:#c6d3ff;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 width:100%;
}

.social-footer {
 display:flex;
 gap:9px;
 background:var(--panel);
 padding:12px;
 border:1px solid var(--border);
 border-top:0;
 border-radius:0 0 12px 12px;
 justify-content:center;
 flex-wrap:wrap;
}

.social-btn {
 padding:9px 14px;
 border-radius:7px;
 text-decoration:none;
 font-weight:bold;
 font-size:12px;
 color:white;
}

.telegram-btn {background:#168bd0}
.facebook-btn {background:#2468d8}
.whatsapp-btn {background:#159c62}

.video-box {
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:10px;
 overflow:hidden;
 position:relative;
 border:1px solid var(--border);
}

#my-video,#clappr-container,#html5-video,#custom-iframe {
 width:100%!important;
 height:100%!important;
 border:0;
 position:absolute;
 inset:0;
}

.modes {
 display:flex;
 gap:8px;
 margin-top:14px;
 justify-content:center;
 flex-wrap:wrap;
 align-items:center;
}

.btn {
 padding:9px 14px;
 font-size:12px;
}

.quality-buttons-wrap {
 display:flex;
 gap:5px;
 background:var(--bg);
 padding:5px;
 border:1px solid var(--border);
 border-radius:8px;
 flex-wrap:wrap;
}

.q-btn {
 padding:6px 9px;
 font-size:11px;
}

.pip-btn {
 background:#7555ce;
}

.input-box {
 display:flex;
 gap:9px;
 max-width:1800px;
 margin:18px auto 10px;
}

#customUrlInput {
 flex:1;
 min-width:0;
 padding:14px;
 background:var(--panel);
 border:1px solid var(--border);
 color:white;
 border-radius:8px;
 outline:none;
}

#customUrlInput:focus {
 border-color:var(--accent);
}

.play-btn {
 background:linear-gradient(120deg,var(--accent),var(--accent2));
 border:0;
 padding:13px 25px;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold;
 color:white;
}

.empty-message {
 text-align:center;
 color:var(--muted);
 grid-column:1/-1;
 padding:20px;
}

::-webkit-scrollbar {width:5px;height:5px}
::-webkit-scrollbar-thumb {
 background:#45547d;
 border-radius:10px;
}

@media(max-width:700px) {
 body {padding:9px}
 .player-section {padding:12px}
 .logo-header {font-size:23px}
 .channel-list {height:55vh;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:9px}
 .ch-btn {height:90px;padding:6px}
 .ch-btn img {width:43px;height:43px}
 .ch-btn strong {font-size:11px}
 .input-box {margin-top:12px}
 .play-btn {padding:12px}
}

@media(max-width:380px) {
 .channel-list {grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>

<div class="main-container">

 <section class="player-section">
  <div class="header-wrapper">
   <div class="logo-header">PARVES TV</div>

   <div class="header-server-switcher">
    <div class="server-title" id="activeChannelName">চ্যানেল সিলেক্ট করুন</div>

    <div class="server-stacked-notices">
     <div class="server-inline-notice">
      <marquee>📢 কোনো ভিডিও প্লে না হলে অন্য প্লেয়ার মোডে চেষ্টা করুন।</marquee>
     </div>
     <div class="server-inline-notice">
      <marquee>💬 যেকোনো প্রয়োজনে নিচে যোগাযোগ করুন।</marquee>
     </div>
    </div>

    <div class="server-buttons-wrap" id="serverButtonsContainer"></div>
   </div>
  </div>

  <div class="video-box">
   <video id="my-video" class="video-js vjs-big-play-centered" controls autoplay playsinline preload="auto"></video>
   <div id="clappr-container" style="display:none"></div>
   <video id="html5-video" controls autoplay playsinline preload="auto" style="display:none"></video>
   <iframe id="custom-iframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="display:none"></iframe>
  </div>

  <div class="modes">
   <button class="btn" onclick="switchMode('videojs')">Main Player</button>
   <button class="btn" onclick="switchMode('clappr')">Clappr</button>
   <button class="btn" onclick="switchMode('html5')">HTML5</button>
   <button class="btn" onclick="switchMode('iframe')">Iframe</button>

   <div class="quality-buttons-wrap">
    <button class="q-btn active" onclick="setManualQualityByHeight(-1,this)">Auto</button>
    <button class="q-btn" onclick="setManualQualityByHeight(1080,this)">1080p</button>
    <button class="q-btn" onclick="setManualQualityByHeight(720,this)">720p</button>
    <button class="q-btn" onclick="setManualQualityByHeight(480,this)">480p</button>
    <button class="q-btn" onclick="setManualQualityByHeight(360,this)">360p</button>
   </div>

   <button class="btn pip-btn" onclick="togglePIP()">PIP Mode</button>
  </div>
 </section>

 <section class="channel-list-container">
  <div class="category-bar">
   <button class="cat-btn active" onclick="filterCategory('all',this)">All</button>
   <button class="cat-btn" onclick="filterCategory('sports',this)">Sports</button>
   <button class="cat-btn" onclick="filterCategory('bangla',this)">Bangla</button>
   <button class="cat-btn" onclick="filterCategory('indian_bangla',this)">Indian Bangla</button>
   <button class="cat-btn" onclick="filterCategory('hindi',this)">Hindi</button>
   <button class="cat-btn" onclick="filterCategory('music',this)">Music</button>
   <button class="cat-btn" onclick="filterCategory('documentary',this)">Documentary</button>
   <button class="cat-btn" onclick="filterCategory('cartoon',this)">Cartoon</button>
  </div>

  <div class="channel-list" id="channelContainer">
   <p class="empty-message">চ্যানেল লোড হচ্ছে...</p>
  </div>

  <div class="social-footer">
   <a href="https://t.me/00" target="_blank" rel="noopener" class="social-btn telegram-btn">📱 Telegram</a>
   <a href="https://www.facebook.com/00" target="_blank" rel="noopener" class="social-btn facebook-btn">🌐 Facebook</a>
   <a href="https://wa.me/8800000" target="_blank" rel="noopener" class="social-btn whatsapp-btn">💬 WhatsApp</a>
  </div>
 </section>
</div>

<div class="input-box">
 <input type="text" id="customUrlInput" placeholder="লিঙ্ক এখানে দিন (M3U8, MPD বা URL)...">
 <button class="play-btn" onclick="playCustom()">প্লে করুন</button>
</div>

<script>
const videoEl=document.getElementById('my-video');
const iframe=document.getElementById('custom-iframe');
const clapprEl=document.getElementById('clappr-container');
const html5El=document.getElementById('html5-video');

let playerInstance=videojs('my-video',{autoplay:true});
let clapprInstance=null,hls=null,dashPlayer=null;
let currentMode='videojs',currentUrl='';
let allChannels=[],currentFilter='all';
let currentChannelObj=null,currentServerIndex=0;
let stallCheckInterval=null;

const FALLBACK_LOGO='https://i.postimg.cc/W1z5BGPZ/20240823_024712.png';

function togglePIP(){
 const media=currentMode==='html5'?html5El:videoEl;
 if(document.pictureInPictureEnabled && media.readyState>0){
  media.requestPictureInPicture().catch(()=>{});
 }
}

function switchMode(mode){
 if(currentUrl)loadChannelUrl(currentUrl,mode);
}

function loadChannel(ch){
 currentChannelObj=ch;
 currentServerIndex=0;

 const box=document.getElementById('serverButtonsContainer');
 document.getElementById('activeChannelName').innerText=ch.name+' - সার্ভার পরিবর্তন করুন';
 box.innerHTML='';

 const urls=Array.isArray(ch.url)?ch.url:[ch.url];

 urls.forEach((link,index)=>{
  const btn=document.createElement('button');
  btn.className='server-btn'+(index===0?' active':'');
  btn.textContent='Server '+(index+1);

  btn.onclick=()=>{
   currentServerIndex=index;
   document.querySelectorAll('.server-btn').forEach(b=>b.classList.remove('active'));
   btn.classList.add('active');
   loadChannelUrl(link,currentMode);
  };
  box.appendChild(btn);
 });

 loadChannelUrl(urls[0],currentMode);
}

function handleFallback(){
 if(!currentChannelObj)return;
 const urls=Array.isArray(currentChannelObj.url)?currentChannelObj.url:[currentChannelObj.url];

 if(currentServerIndex<urls.length-1){
  currentServerIndex++;
  document.querySelectorAll('.server-btn').forEach((b,i)=>{
   b.classList.toggle('active',i===currentServerIndex);
  });
  loadChannelUrl(urls[currentServerIndex],currentMode);
 }
}

function setManualQualityByHeight(height,btn){
 document.querySelectorAll('.q-btn').forEach(b=>b.classList.remove('active'));
 if(btn)btn.classList.add('active');

 if(!hls)return;

 if(height===-1){
  hls.currentLevel=-1;
  return;
 }

 let closest=-1,diff=Infinity;
 hls.levels.forEach((level,index)=>{
  if(level.height){
   const d=Math.abs(level.height-height);
   if(d<diff){diff=d;closest=index;}
  }
 });

 if(closest!==-1)hls.currentLevel=closest;
}

function loadChannelUrl(url,mode){
 if(!url)return;

 currentUrl=url;
 currentMode=mode;

 [videoEl,iframe,clapprEl,html5El].forEach(el=>el.style.display='none');

 if(stallCheckInterval)clearInterval(stallCheckInterval);
 if(hls){hls.destroy();hls=null;}
 if(dashPlayer){dashPlayer.reset();dashPlayer=null;}
 if(clapprInstance){clapprInstance.destroy();clapprInstance=null;}

 playerInstance.pause();
 playerInstance.reset();
 html5El.pause();
 html5El.removeAttribute('src');
 html5El.load();
 iframe.src='about:blank';

 document.querySelectorAll('.q-btn').forEach((b,i)=>b.classList.toggle('active',i===0));

 const play=(media,isVjs=false)=>{
  if(isVjs){
   media.muted(false);
   media.volume(1);
   const p=media.play();
   if(p)p.catch(()=>{
    media.muted(true);
    media.play().catch(()=>{});
   });
  }else{
   media.muted=false;
   media.volume=1;
   const p=media.play();
   if(p)p.catch(()=>{
    media.muted=true;
    media.play().catch(()=>{});
   });
  }
 };

 if(mode==='iframe'){
  iframe.src=url;
  iframe.style.display='block';
  return;
 }

 if(mode==='clappr'){
  clapprEl.style.display='block';
  clapprInstance=new Clappr.Player({
   source:url,parentId:'#clappr-container',
   width:'100%',height:'100%',autoPlay:true,mute:false
  });
  return;
 }

 if(mode==='html5'){
  html5El.style.display='block';
  html5El.onerror=handleFallback;
  html5El.src=url;
  play(html5El);
  return;
 }

 videoEl.style.display='block';

 if(/\.mpd($|\?)/i.test(url)||url.includes('dash')){
  if(typeof dashjs!=='undefined'){
   dashPlayer=dashjs.MediaPlayer().create();
   dashPlayer.initialize(videoEl,url,true);
  }else{
   playerInstance.src({src:url,type:'application/dash+xml'});
  }
  return;
 }

 if(typeof Hls!=='undefined'&&Hls.isSupported()){
  hls=new Hls({
   enableWorker:true,
   lowLatencyMode:false,
   maxBufferLength:60,
   maxMaxBufferLength:120,
   maxBufferSize:60*1024*1024,
   backBufferLength:30,
   liveSyncDurationCount:6,
   liveMaxLatencyDurationCount:15,
   fragLoadingTimeOut:20000,
   fragLoadingMaxRetry:4,
   fragLoadingRetryDelay:1000
  });

  hls.loadSource(url);
  hls.attachMedia(videoEl);

  hls.on(Hls.Events.MANIFEST_PARSED,()=>play(playerInstance,true));

  let lastTime=-1,stalls=0;
  stallCheckInterval=setInterval(()=>{
   if(!videoEl.paused){
    if(videoEl.currentTime===lastTime){
     if(++stalls>=3){
      hls?.startLoad();
      stalls=0;
     }
    }else{
     stalls=0;
     lastTime=videoEl.currentTime;
    }
   }
  },2000);

  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(!data.fatal)return;

   if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
    hls.startLoad();
   }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
    hls.recoverMediaError();
   }else{
    handleFallback();
   }
  });
 }else if(videoEl.canPlayType('application/vnd.apple.mpegurl')){
  playerInstance.src({src:url,type:'application/x-mpegURL'});
  play(playerInstance,true);
 }else{
  playerInstance.src({src:url,type:'application/x-mpegURL'});
  play(playerInstance,true);
 }
}

function playCustom(){
 const url=document.getElementById('customUrlInput').value.trim();
 if(!url)return;

 document.getElementById('serverButtonsContainer').innerHTML='';
 document.getElementById('activeChannelName').innerText='Custom URL';
 currentChannelObj=null;
 loadChannelUrl(url,currentMode);
}

function normalizeCategory(group,title){
 const g=(group||'').toLowerCase().replace(/[\s-]+/g,'_');
 const t=(title||'').toLowerCase();
 const has=(...words)=>words.some(w=>g.includes(w)||t.includes(w));

 if(has('sport','cricket','football','willow','ten_sport','bein','dazn','tsn','tnt_sport','fifa','setanta','fox_sport','goal_tv'))return 'sports';

 if(has('documentary','docu','discovery','nat_geo','national_geo','animal_planet','history','science','earth','wild','investigation','crime','travel','weather'))return 'documentary';

 if(has('cartoon','kids','duronto','nick','pogo','hungama','disney','motu_patlu','tom_&_jerry','doraemon','sony_yay','rongeen'))return 'cartoon';

 if(has('music','9xm','mtv','zing','mastiii','sangeet'))return 'music';

 if(has('indian_bangla','indian','jalsha','zee_bangla','colors_bangla','sun_bangla','sananda','zb_cinema'))return 'indian_bangla';

 if(has('hindi','movies','movie_club','star_gold','sony_max','zee_tv','zee_cinema','bollywood','goldmines','pictures','shemaroo','b4u','hbo','cineplex','cinema','rishtey','star_plus','star_bharat','utv','bhojpuri','sony_sab','sony_pal'))return 'hindi';

 if(g.includes('bangla')||g.includes('bengali'))return 'bangla';

 return 'bangla';
}

function renderChannels(){
 const container=document.getElementById('channelContainer');
 container.innerHTML='';

 const filtered=allChannels.filter(ch=>
  currentFilter==='all'||ch.group===currentFilter
 );

 if(!filtered.length){
  container.innerHTML='<p class="empty-message">এই ক্যাটাগরিতে কোনো চ্যানেল পাওয়া যায়নি।</p>';
  return;
 }

 filtered.forEach(ch=>{
  const btn=document.createElement('div');
  btn.className='ch-btn';

  const img=document.createElement('img');
  img.src=ch.logo||FALLBACK_LOGO;
  img.alt=ch.name;
  img.onerror=()=>{img.onerror=null;img.src=FALLBACK_LOGO;};

  const name=document.createElement('strong');
  name.textContent=ch.name;

  btn.append(img,name);
  btn.onclick=()=>loadChannel(ch);
  container.appendChild(btn);
 });

 if(!currentUrl&&filtered.length)loadChannel(filtered[0]);
}

function filterCategory(category,btn){
 document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 currentFilter=category;
 renderChannels();
}

const playlistUrl='https://raw.githubusercontent.com/bushmr263-ship-it/online-tv/main/playlist.m3u?t='+Date.now();

fetch(playlistUrl,{cache:'no-store'})
.then(response=>{
 if(!response.ok)throw new Error('Playlist not found');
 return response.text();
})
.then(data=>{
 const lines=data.split(/\r?\n/);
 let title='',logo=FALLBACK_LOGO,group='';

 for(const rawLine of lines){
  const line=rawLine.trim();

  if(line.startsWith('#EXTINF')){
   const logoMatch=line.match(/tvg-logo="([^"]+)"/i);
   const groupMatch=line.match(/group-title="([^"]+)"/i);
   logo=logoMatch?logoMatch[1]:FALLBACK_LOGO;
   group=groupMatch?groupMatch[1].trim():'';
   title=line.substring(line.lastIndexOf(',')+1).trim();
  }else if(line&&!line.startsWith('#')&&title){
   const urls=line.match(/https?:\/\/[^\s]+/g)||[line];
   allChannels.push({
    name:title,
    logo:logo,
    url:urls.length===1?urls[0]:urls,
    group:normalizeCategory(group,title)
   });
   title='';
  }
 }

 if(!allChannels.length)throw new Error('No channels found');
 renderChannels();
})
.catch(error=>{
 console.error('Playlist error:',error);
 document.getElementById('channelContainer').innerHTML=
 '<p class="empty-message">প্লেলিস্ট লোড করা যায়নি। পরে আবার চেষ্টা করুন।</p>';
});
</script>
</body>
</html>
