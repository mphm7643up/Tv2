
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARVEZ LINK</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:20px}
.container{max-width:600px;margin:30px auto}
h1{text-align:center;color:#38bdf8}
.card{background:#1e293b;padding:20px;border-radius:14px;margin:15px 0}
input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border:0;border-radius:8px}
input{background:#334155;color:white}
button{background:#0284c7;color:white;cursor:pointer}
.item{background:#334155;padding:12px;margin:10px 0;border-radius:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h1>PARVEZ LINK</h1>
<div class="card">
<h3>Admin Login</h3>
<input id="token" type="password" placeholder="Admin Password">
<button onclick="loadLinks()">Login</button>
</div>
<div class="card">
<h3>Create Link</h3>
<input id="url" type="url" placeholder="Original URL">
<input id="slug" placeholder="Custom Link Name">
<input id="expiry" type="datetime-local">
<button onclick="createLink()">Create Link</button>
</div>
<div class="card">
<h3>My Links</h3>
<div id="links">Login first</div>
<button onclick="loadLinks()">Refresh</button>
</div>
</div>
<script>
const API="https://YOUR-WORKER.workers.dev";
function headers(){
return {"Content-Type":"application/json","x-admin-token":document.getElementById("token").value};
}
async function api(path,data){
const r=await fetch(API+path,{
method:data?"POST":"GET",headers:headers(),
body:data?JSON.stringify(data):undefined
});
const j=await r.json();
if(!r.ok)throw Error(j.error||"Request failed");
return j;
}
async function createLink(){
try{
const url=document.getElementById("url").value.trim();
const slug=document.getElementById("slug").value.trim();
const date=document.getElementById("expiry").value;
if(!url||!slug)return alert("সব তথ্য দিন");
await api("/api/create",{url,slug,expiresAt:date?new Date(date).getTime():null});
alert("Link created!");
loadLinks();
}catch(e){alert(e.message)}
}
async function loadLinks(){
try{
const data=await api("/api/list");
const box=document.getElementById("links");
box.replaceChildren();
data.links.forEach(link=>{
const div=document.createElement("div");
div.className="item";
const title=document.createElement("b");
title.textContent=link.slug;
const a=document.createElement("a");
a.href=API+"/"+encodeURIComponent(link.slug);
a.textContent=a.href;
a.style.color="#38bdf8";
const status=document.createElement("p");
status.textContent=link.enabled?"Active":"Disabled";
const toggle=document.createElement("button");
toggle.textContent=link.enabled?"Disable":"Enable";
toggle.onclick=()=>change(link.slug,!link.enabled);
const del=document.createElement("button");
del.textContent="Delete";
del.onclick=()=>remove(link.slug);
div.append(title,document.createElement("br"),a,status,toggle,del);
box.appendChild(div);
});
}catch(e){alert(e.message)}
}
async function change(slug,enabled){
try{await api("/api/toggle",{slug,enabled});loadLinks()}
catch(e){alert(e.message)}
}
async function remove(slug){
if(!confirm("Delete this link?"))return;
try{await api("/api/delete",{slug});loadLinks()}
catch(e){alert(e.message)}
}
</script>
</body>
</html>
