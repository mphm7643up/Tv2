
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Stream Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>

<style>
:root{
--bg:#f4f5f7;
--white:#fff;
--text:#20242b;
--muted:#858d98;
--line:#e5e7eb;
--blue:#2867b2;
--blue-light:#edf4fc;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif;
}
header{
height:65px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;
padding:0 5%;
}
.brand{font-size:20px;font-weight:700}
.brand span{color:var(--blue)}
.header-right{font-size:12px;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:20px 15px}
.card{
background:white;border:1px solid var(--line);
border-radius:9px;margin-bottom:16px;overflow:hidden;
}
.pad{padding:16px}
h3{font-size:15px;margin:0 0 13px}
input{
padding:12px;border:1px solid #d9dee5;
border-radius:5px;min-width:0;
color:#222;background:white;
}
input:focus{outline:1px solid var(--blue)}
button{
border:0;border-radius:5px;padding:10px 14px;
cursor:pointer;font-weight:600;
}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--blue);color:white}
.import{display:flex;gap:8px}
#playlistUrl{flex:1;width:100%}
#status{font-size:12px;color:#777;margin-top:10px}
.layout{
display:grid;grid-template-columns:220px minmax(0,1fr);
gap:16px;align-items:start;
}
.categories{padding:8px}
.category{
display:flex;justify-content:space-between;
width:100%;text-align:left;background:white;
color:#454d58;margin:3px 0;padding:12px 10px;
font-size:13px;gap:10px;
}
.category:hover{background:#f5f6f8}
.category.active{background:var(--blue-light);color:var(--blue)}
.count{color:#999}
.player{padding:12px;background:#101010}
video{
display:block;width:100%;aspect-ratio:16/9;
max-height:520px;background:#000;
}
.player-info{
padding:13px 15px;display:flex;
justify-content:space-between;gap:10px;align-items:center;
}
#playing{font-size:14px;font-weight:bold}
.sub{font-size:11px;color:#888;margin-top:5px}
.error{
background:#fff3f1;color:#a33226;
padding:12px;font-size:12px;display:none;line-height:1.6;
}
.player-actions{padding:0 15px 14px;display:flex;gap:8px}
.toolbar{
padding:13px 15px;border-bottom:1px solid #eee;
display:flex;justify-content:space-between;
gap:10px;align-items:center;
}
.toolbar h3{margin:0}
#search{width:220px}
.channel{
display:flex;align-items:center;gap:10px;
padding:11px;border-bottom:1px solid #eee;
}
.channel.active{background:#edf4fc}
.logo{
width:36px;height:36px;object-fit:contain;
background:#eee;border-radius:5px;flex-shrink:0;
}
.info{flex:1;min-width:0;cursor:pointer}
.name{
font-size:13px;font-weight:600;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.group{font-size:11px;color:#999;margin-top:5px}
.actions{display:flex;gap:5px}
.play{background:#edf4fc;color:#2867b2;font-size:11px}
.copy{background:#f0f1f3;color:#444;font-size:11px}
.empty{text-align:center;padding:30px;color:#888;font-size:13px}
footer{text-align:center;padding:20px;color:#999;font-size:11px}
@media(max-width:700px){
main{padding:12px 9px}
.layout{grid-template-columns:1fr}
.categories{display:flex;overflow-x:auto;gap:4px}
.category{width:auto;white-space:nowrap;flex-shrink:0}
.import{flex-direction:column}
.import button{width:100%}
.toolbar{flex-direction:column;align-items:stretch}
#search{width:100%}
.channel{gap:7px;padding:10px 6px}
.logo{width:31px;height:31px}
.actions button{padding:9px 7px}
header{padding:0 14px}
}
</style>
</head>

<body>

<header>
<div class="brand">Stream<span>Player</span></div>
<div class="header-right">M3U Playlist Player</div>
</header>

<main>

<section class="card pad">
<h3>Playlist Import</h3>
<div class="import">
<input id="playlistUrl" type="url"
placeholder="Paste M3U Playlist URL">
<button class="primary" id="loadBtn">Load Playlist</button>
</div>
<div style="margin-top:12px">
<input type="file" id="file" accept=".m3u,.m3u8,.txt">
</div>
<div id="status">Upload your playlist or enter an M3U URL.</div>
</section>

<div class="layout">

<aside class="card">
<div class="pad"><h3>Categories</h3></div>
<div class="categories" id="categories">
<div class="empty">No categories</div>
</div>
</aside>

<div>

<section class="card">
<div class="player">
<video id="video" controls playsinline preload="metadata"></video>
</div>

<div class="player-info">
<div>
<div id="playing">Select a channel</div>
<div class="sub" id="playingGroup">Ready to play</div>
</div>
<div class="sub" id="playerMode">PLAYER</div>
</div>

<div class="error" id="error"></div>

<div class="player-actions">
<button class="primary" id="retryBtn">Retry Playback</button>
</div>
</section>

<section class="card">
<div class="toolbar">
<h3 id="categoryTitle">All Channels (0)</h3>
<input id="search" placeholder="Search channel...">
</div>
<div id="channels">
<div class="empty">No playlist loaded.</div>
</div>
</section>

</div>
</div>
</main>

<footer>Stream Player</footer>

<script>
let channels=[];
let active=-1;
let selectedCategory='ALL';
let hls=null;
let currentURL='';
let generation=0;
let retryCount=0;

const video=document.getElementById('video');
const errorBox=document.getElementById('error');

const $=id=>document.getElementById(id);

function status(text){
$('status').textContent=text;
}

function showError(text){
errorBox.style.display='block';
errorBox.textContent=text;
}

function clearError(){
errorBox.style.display='none';
errorBox.textContent='';
}

function stopVideo(){
generation++;
if(hls){
hls.destroy();
hls=null;
}
video.pause();
video.removeAttribute('src');
video.load();
}

// M3U PARSER
function parseM3U(text,base=''){
const lines=text.split(/\r?\n/);
const result=[];
let current=null;

for(const raw of lines){
const line=raw.trim();
if(!line)continue;

if(line.startsWith('#EXTINF:')){
const comma=line.indexOf(',');
const meta=comma<0?line:line.slice(0,comma);
const name=comma<0?'Unknown Channel':line.slice(comma+1).trim();

function attr(key){
const m=meta.match(new RegExp(key+'\\s*=\\s*"([^"]*)"','i'));
return m?m[1]:'';
}

current={
name:name||'Unknown Channel',
logo:attr('tvg-logo'),
group:attr('group-title')||'Uncategorized'
};

}else if(!line.startsWith('#')){
let url=line;
try{
if(base)url=new URL(line,base).href;
}catch(e){}

result.push({
name:current?.name||'Unknown Channel',
logo:current?.logo||'',
group:current?.group||'Uncategorized',
url
});
current=null;
}
}
return result;
}

// IMPORT PLAYLIST
function setPlaylist(text,base=''){
const parsed=parseM3U(text,base);

if(!parsed.length){
status('No valid channels found in this playlist.');
return;
}

channels=parsed;
active=-1;
selectedCategory='ALL';
currentURL='';

stopVideo();
clearError();

$('playing').textContent='Select a channel';
$('playingGroup').textContent='Ready to play';
$('playerMode').textContent='PLAYER';
$('search').value='';

renderCategories();
renderChannels();

status(channels.length+' channels loaded successfully.');
}

$('file').addEventListener('change',async e=>{
const file=e.target.files[0];
if(!file)return;

try{
const text=await file.text();
setPlaylist(text);
}catch(err){
status('Unable to read playlist file.');
}
});

$('loadBtn').addEventListener('click',loadURL);

async function loadURL(){
const url=$('playlistUrl').value.trim();

if(!url){
status('Enter an M3U URL first.');
return;
}

$('loadBtn').disabled=true;
status('Loading playlist...');

try{
const response=await fetch(url);
if(!response.ok)throw Error('HTTP '+response.status);

const text=await response.text();

if(!text.includes('#EXTM3U')&&!text.includes('#EXTINF')){
throw Error('Invalid M3U playlist');
}

setPlaylist(text,url);

}catch(e){
status('Playlist load failed. Check URL and server CORS permissions.');
}finally{
$('loadBtn').disabled=false;
}
}

// CATEGORY SYSTEM
function renderCategories(){
const box=$('categories');
box.replaceChildren();

const groups=[...new Set(channels.map(c=>c.group))];

function addCategory(name,count,key){
const btn=document.createElement('button');
btn.className='category'+(selectedCategory===key?' active':'');
btn.append(document.createTextNode(name));

const number=document.createElement('span');
number.className='count';
number.textContent=count;
btn.append(number);

btn.onclick=()=>{
selectedCategory=key;
renderCategories();
renderChannels();
};

box.append(btn);
}

addCategory('All Channels',channels.length,'ALL');

groups.forEach(group=>{
addCategory(
group,
channels.filter(c=>c.group===group).length,
group
);
});
}

// CHANNEL LIST
function renderChannels(){
const box=$('channels');
const q=$('search').value.toLowerCase();

const filtered=channels.map((c,i)=>({...c,index:i}))
.filter(c=>
(selectedCategory==='ALL'||c.group===selectedCategory)&&
c.name.toLowerCase().includes(q)
);

$('categoryTitle').textContent=
(selectedCategory==='ALL'?'All Channels':selectedCategory)+
' ('+filtered.length+')';

box.replaceChildren();

if(!filtered.length){
box.innerHTML='<div class="empty">No channels found.</div>';
return;
}

filtered.forEach(c=>{
const row=document.createElement('div');
row.className='channel'+(active===c.index?' active':'');

const logo=document.createElement('img');
logo.className='logo';
logo.alt='';

logo.src=c.logo||'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"%3E%3Crect width="40" height="40" fill="%23e5e7eb"/%3E%3Ctext x="20" y="26" font-size="18" text-anchor="middle" fill="%23777"%3ETV%3C/text%3E%3C/svg%3E';

logo.onerror=()=>logo.removeAttribute('src');

const info=document.createElement('div');
info.className='info';

const name=document.createElement('div');
name.className='name';
name.textContent=c.name;

const group=document.createElement('div');
group.className='group';
group.textContent=c.group;

info.append(name,group);
info.onclick=()=>playChannel(c.index);

const actions=document.createElement('div');
actions.className='actions';

const play=document.createElement('button');
play.className='play';
play.textContent='Play';
play.onclick=()=>playChannel(c.index);

const copy=document.createElement('button');
copy.className='copy';
copy.textContent='Copy';

copy.onclick=async()=>{
try{
await navigator.clipboard.writeText(c.url);
copy.textContent='Copied ✓';
setTimeout(()=>copy.textContent='Copy',1500);
}catch(e){
window.prompt('Copy channel link:',c.url);
}
};

actions.append(play,copy);
row.append(logo,info,actions);
box.append(row);
});
}

$('search').addEventListener('input',renderChannels);

// VIDEO PLAYER
function playChannel(index){
const channel=channels[index];
if(!channel)return;

active=index;
currentURL=channel.url;
retryCount=0;

$('playing').textContent=channel.name;
$('playingGroup').textContent=channel.group;

renderChannels();
startPlayback(currentURL);
}

function startPlayback(url){
stopVideo();
clearError();

const thisGeneration=generation;
const isHLS=/\.m3u8(?:$|[?#])/i.test(url);

if(isHLS){
startHLS(url,thisGeneration);
}else{
$('playerMode').textContent='Direct Video';
video.src=url;
video.load();

video.play().catch(()=>{
if(thisGeneration===generation){
showError('Play বাটনে চাপ দিন অথবা ভিডিও URL পরীক্ষা করুন।');
}
});
}
}

function startHLS(url,token){
if(typeof Hls==='undefined'){
showError('HLS Player লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।');
return;
}

if(Hls.isSupported()){
$('playerMode').textContent='HLS Player';

hls=new Hls({
enableWorker:true,
lowLatencyMode:false,
backBufferLength:60,
maxBufferLength:30
});

hls.on(Hls.Events.MANIFEST_PARSED,()=>{
if(token!==generation)return;

video.play().catch(()=>{
if(token===generation){
showError('ভিডিও চালু করতে প্লেয়ারের Play বাটনে চাপ দিন।');
}
});
});

hls.on(Hls.Events.ERROR,(event,data)=>{
if(token!==generation||!data.fatal)return;

if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
showError('নেটওয়ার্ক সমস্যা। Retry Playback চাপ দিয়ে চেষ্টা করুন।');
}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
showError('ভিডিও পুনরুদ্ধারের চেষ্টা চলছে।');
hls.recoverMediaError();
}else{
showError('স্ট্রিম প্লে করা যায়নি। URL, CORS ও স্ট্রিম পরীক্ষা করুন।');
hls.destroy();
hls=null;
}
});

hls.loadSource(url);
hls.attachMedia(video);

}else if(video.canPlayType('application/vnd.apple.mpegurl')){
$('playerMode').textContent='Native HLS';
video.src=url;
video.load();

video.play().catch(()=>{
showError('ভিডিও চালু করতে Play বাটনে চাপ দিন।');
});

}else{
showError('এই ব্রাউজারে HLS সাপোর্ট নেই।');
}
}

// VIDEO EVENTS
video.addEventListener('playing',()=>{
clearError();
status('Playing: '+$('playing').textContent);
});

video.addEventListener('waiting',()=>{
status('Video buffering...');
});

video.addEventListener('error',()=>{
if(!currentURL)return;

const code=video.error?.code;
let message='ভিডিও চালানো যাচ্ছে না।';

if(code===2)message='Network error: স্ট্রিম লোড হয়নি।';
if(code===3)message='ভিডিও ডিকোড করা যাচ্ছে না।';
if(code===4)message='ভিডিও ফরম্যাট ব্রাউজার সমর্থন করছে না।';

showError(message+' URL ও সার্ভার পরীক্ষা করুন।');
});

$('retryBtn').onclick=()=>{
if(!currentURL){
showError('প্রথমে একটি চ্যানেল নির্বাচন করুন।');
return;
}
startPlayback(currentURL);
};

</script>
</body>
</html>
