<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লাইভ স্ট্রিম প্লেয়ার</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px;
    display: grid; place-items: center;
    background: #080d18; font-family: Arial, sans-serif;
  }
  .player {
    width: 100%; max-width: 1000px; padding: 12px;
    background: #101a30; border: 1px solid #263d60;
    border-radius: 16px;
  }
  .screen {
    width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000; border-radius: 10px;
    display: grid; place-items: center;
  }
  video, iframe { display: block; width: 100%; height: 100%; border: 0; }
  .message { color: #ddd; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="player">
  <div class="screen" id="screen">
    <div class="message">লাইভ স্ট্রিম লোড হচ্ছে...</div>
  </div>
</div>

<script>
// https://www.youtube.com/live/jmsrDY7XsNo?si=2ZwyFNY28T71umWy:
const STREAM_URL = "PASTE_YOUR_STREAM_LINK_HERE";

const screen = document.getElementById("screen");
let hlsPlayer = null;

function showMessage(message) {
  screen.innerHTML = "";
  const p = document.createElement("p");
  p.className = "message";
  p.textContent = message;
  screen.appendChild(p);
}

function startPlayer() {
  let url;
  try {
    url = new URL(STREAM_URL);
    if (!["http:", "https:"].includes(url.protocol)) throw new Error();
  } catch {
    showMessage("কোডের STREAM_URL লাইনে একটি সঠিক স্ট্রিমিং লিংক বসাও।");
    return;
  }

  const host = url.hostname.toLowerCase();

  // https://www.youtube.com/live/jmsrDY7XsNo?si=2ZwyFNY28T71umWy
  if (host === "youtu.be" || host === "youtube.com" || host.endsWith(".youtube.com")) {
    let videoId = host === "youtu.be"
      ? url.pathname.split("/").filter(Boolean)[0]
      : url.searchParams.get("v");

    if (!videoId) {
      const match = url.pathname.match(/\/(?:live|embed|shorts)\/([^/?]+)/);
      if (match) videoId = match[1];
    }

    if (!videoId || !/^[\w-]{11}$/.test(videoId)) {
      showMessage("YouTube ভিডিও আইডি পাওয়া যায়নি।");
      return;
    }

    const frame = document.createElement("iframe");
    frame.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId);
    frame.allow = "autoplay; encrypted-media; picture-in-picture";
    frame.allowFullscreen = true;
    screen.innerHTML = "";
    screen.appendChild(frame);
    return;
  }

  // Facebook-এর পাবলিক এবং embed-অনুমোদিত ভিডিও
  if (host === "facebook.com" || host.endsWith(".facebook.com") || host === "fb.watch") {
    const frame = document.createElement("iframe");
    frame.src = "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(url.href);
    frame.allow = "autoplay; encrypted-media; picture-in-picture";
    frame.allowFullscreen = true;
    screen.innerHTML = "";
    screen.appendChild(frame);
    return;
  }

  // সরাসরি HLS বা ভিডিও ফাইল
  if (/\.(m3u8|mp4|webm|ogg)$/i.test(url.pathname)) {
    const video = document.createElement("video");
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    screen.innerHTML = "";
    screen.appendChild(video);

    if (/\.m3u8$/i.test(url.pathname)) {
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url.href;
        video.play().catch(() => {});
      } else if (window.Hls && Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(url.href);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) showMessage("স্ট্রিম চালানো যায়নি। URL বা CORS অনুমতি পরীক্ষা করো।");
        });
      } else {
        showMessage("এই ব্রাউজারে HLS চালানো যাচ্ছে না।");
      }
    } else {
      video.src = url.href;
      video.play().catch(() => {});
    }
    return;
  }

  showMessage("এই URL সরাসরি ভিডিও নয়। এই সাইটের অনুমোদিত Embed Player দরকার।");
}

startPlayer();
</script>
</body>
</html>
